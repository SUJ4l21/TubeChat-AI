<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <style>
        /* Importing Inter for that clean, modern, editorial tech vibe */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        :root {
            /* Calm, pure dark grey palette - strictly no blues */
            --bg-base: #111111;
            --bg-surface: #1a1a1a;
            --bg-elevated: #242424;

            /* Typography */
            --text-primary: #ededed;
            --text-secondary: #888888;
            --text-muted: #666666;

            /* Accents & Borders */
            --accent: #ffffff;
            --accent-text: #000000;
            --border-faint: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.15);

            /* Structural Variables */
            --radius-lg: 12px;
            --radius-md: 8px;
            --radius-sm: 6px;
            --shadow-float: 0 8px 24px rgba(0, 0, 0, 0.4);
            --shadow-glow: 0 0 0 1px var(--border-strong), 0 0 12px rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 360px;
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* --- Header Section --- */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-faint);
        }

        .header h3 {
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Subtle indicator dot */
        .header h3::before {
            content: "";
            display: block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--text-secondary);
        }

        .status-badge {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
            background: transparent;
            border: 1px solid var(--border-faint);
            padding: 2px 8px;
            border-radius: 99px;
            letter-spacing: 0.02em;
        }

        /* --- Chat Canvas --- */
        #chat-box {
            height: 280px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 4px;
            /* Room for scrollbar */
            scroll-behavior: smooth;
        }

        /* Elegant minimal scrollbar */
        #chat-box::-webkit-scrollbar {
            width: 4px;
        }

        #chat-box::-webkit-scrollbar-track {
            background: transparent;
        }

        #chat-box::-webkit-scrollbar-thumb {
            background: var(--bg-elevated);
            border-radius: 4px;
        }

        #chat-box::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* Base Chat Bubble */
        #chat-box p {
            font-size: 0.85rem;
            line-height: 1.6;
            padding: 10px 14px;
            border-radius: var(--radius-md);
            max-width: 88%;
            word-wrap: break-word;
        }

        /* AI Responses (Left aligned, surface background) */
        #chat-box p:not(.system-alert):not(.user-msg-style) {
            background: var(--bg-surface);
            color: var(--text-primary);
            border: 1px solid var(--border-faint);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            /* Sharp anchor corner */
        }

        /* User Prompts (Right aligned, elevated background) */
        #chat-box p.user-msg-style {
            background: var(--bg-elevated);
            color: var(--text-primary);
            align-self: flex-end;
            border: 1px solid var(--border-faint);
            border-bottom-right-radius: 2px;
            /* Sharp anchor corner */
        }

        /* System/Error Alerts (Calm, muted grey, no bright reds) */
        #chat-box p.system-alert {
            background: transparent;
            color: var(--text-secondary);
            border: 1px dashed var(--border-strong);
            text-align: center;
            font-size: 0.8rem;
            align-self: center;
            width: 100%;
            max-width: 100%;
            border-radius: var(--radius-sm);
            padding: 8px;
        }

        /* Hide the bold "You:" text dynamically to keep bubbles clean */
        #chat-box p b {
            display: none;
        }

        /* --- Input Dock --- */
        #input-container {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-surface);
            border: 1px solid var(--border-faint);
            padding: 6px 6px 6px 14px;
            border-radius: var(--radius-lg);
            transition: all 0.2s ease;
        }

        #input-container:focus-within {
            background: var(--bg-elevated);
            box-shadow: var(--shadow-glow);
            border-color: var(--border-strong);
        }

        input {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.85rem;
            outline: none;
        }

        input::placeholder {
            color: var(--text-muted);
        }

        input:disabled {
            cursor: not-allowed;
            opacity: 0.4;
        }

        /* Tactile Action Button */
        button {
            background: var(--accent);
            color: var(--accent-text);
            border: none;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 2px 8px rgba(255, 255, 255, 0.1);
        }

        button:hover:not(:disabled) {
            background: #e0e0e0;
            /* Slightly darker white */
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.15);
        }

        button:active:not(:disabled) {
            transform: scale(0.96);
            /* Tactile press effect */
            box-shadow: none;
        }

        button:disabled {
            background: var(--bg-elevated);
            color: var(--text-muted);
            box-shadow: none;
            cursor: not-allowed;
        }
    </style>
    <title>TubeChat</title>
</head>

<body>
    <div class="header">
        <h3>TubeChat AI</h3>
        <span class="status-badge" id="global-status">v1.0</span>
    </div>

    <div id="chat-box"></div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Ask a question..." disabled>
        <button id="send-btn" disabled>Run</button>
    </div>

    <script src="popup.js"></script>
</body>

</html>
